[package]
name = "nvogue"
version = "0.1.0"
edition = "2024"

[dependencies]
relm4 = { version = "0.11", features = [ "libadwaita", "gnome_50" ] }
relm4-components = "0.11"
relm4-icons = "0.11"

zbus = { version = "6", features = [ "tokio" ]}
tokio = { version = "1", features = ["full"] }

nvogue-protocol = { path = "../nvogue-protocol" }
